<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bg1974" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="60%" stop-color="#290f02"/>
      <stop offset="100%" stop-color="#170801"/>
    </linearGradient>
    <linearGradient id="antiqueGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" rx="8" fill="url(#bg1974)"/>
  <rect x="0" y="0" width="36" height="800" fill="#000" fill-opacity="0.35"/>
  <line x1="36" y1="0" x2="36" y2="800" stroke="#d97706" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Heavy Blind Deboss Border -->
  <rect x="52" y="40" width="498" height="720" rx="2" fill="none" stroke="url(#antiqueGold)" stroke-width="4"/>
  <rect x="64" y="52" width="474" height="696" rx="2" fill="none" stroke="url(#antiqueGold)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="300" y="140" font-family="'Cinzel', Georgia, serif" font-size="16" letter-spacing="6" fill="#fde68a" text-anchor="middle">THE HERITAGE ARCHIVE</text>
  <text x="300" y="170" font-family="'Cinzel', Georgia, serif" font-size="12" letter-spacing="4" fill="#d97706" text-anchor="middle">50TH ANNIVERSARY JUBILEE</text>

  <!-- Crest -->
  <g transform="translate(300, 340)">
    <circle cx="0" cy="0" r="90" fill="#290f02" stroke="url(#antiqueGold)" stroke-width="3"/>
    <polygon points="0,-70 20,-20 70,-20 30,10 45,60 0,30 -45,60 -30,10 -70,-20 -20,-20" fill="url(#antiqueGold)" fill-opacity="0.3"/>
    <text x="0" y="20" font-family="'Cinzel', Georgia, serif" font-size="54" font-weight="900" fill="url(#antiqueGold)" text-anchor="middle">1974</text>
  </g>

  <!-- Title -->
  <text x="300" y="515" font-family="'Cinzel', Georgia, serif" font-size="34" font-weight="800" letter-spacing="4" fill="url(#antiqueGold)" text-anchor="middle">GOLDEN JUBILEE</text>
  <text x="300" y="560" font-family="'Playfair Display', Georgia, serif" font-size="18" font-style="italic" fill="#fed7aa" text-anchor="middle">Fiftieth Graduating Class</text>

  <rect x="210" y="620" width="180" height="34" rx="4" fill="#290f02" stroke="url(#antiqueGold)" stroke-width="1"/>
  <text x="300" y="642" font-family="'Cinzel', Georgia, serif" font-size="14" letter-spacing="3" font-weight="700" fill="#fef3c7" text-anchor="middle">CLASS OF ’74</text>
</svg>
