<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bg2000" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#311042"/>
      <stop offset="100%" stop-color="#0f0728"/>
    </linearGradient>
    <linearGradient id="y2kHolo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" rx="8" fill="url(#bg2000)"/>
  <rect x="0" y="0" width="36" height="800" fill="#000" fill-opacity="0.3"/>
  <line x1="36" y1="0" x2="36" y2="800" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Y2K Millennium Ring Design -->
  <g transform="translate(300, 320)">
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#y2kHolo)" stroke-width="2" stroke-dasharray="12 8"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#67e8f9" stroke-width="1" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="140" ry="40" fill="none" stroke="url(#y2kHolo)" stroke-width="2.5" transform="rotate(-25)"/>
    
    <text x="0" y="-20" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="700" letter-spacing="8" fill="#f8fafc" text-anchor="middle">MILLENNIUM</text>
    <text x="0" y="45" font-family="'Cinzel', Georgia, serif" font-size="64" font-weight="900" fill="url(#y2kHolo)" text-anchor="middle">2000</text>
  </g>

  <text x="300" y="110" font-family="'Cinzel', Georgia, serif" font-size="14" letter-spacing="6" fill="#c084fc" text-anchor="middle">THE DAWN OF A NEW ERA</text>

  <!-- Title Bottom -->
  <text x="300" y="540" font-family="'Cinzel', Georgia, serif" font-size="34" font-weight="800" letter-spacing="4" fill="#ffffff" text-anchor="middle">ODYSSEY</text>
  <text x="300" y="580" font-family="'Playfair Display', Georgia, serif" font-size="16" font-style="italic" fill="#cbd5e1" text-anchor="middle">The Senior Class Millennium Chronicle</text>

  <rect x="190" y="630" width="220" height="36" rx="18" fill="#2e1065" stroke="url(#y2kHolo)" stroke-width="2"/>
  <text x="300" y="654" font-family="'Cinzel', Georgia, serif" font-size="15" letter-spacing="4" font-weight="700" fill="#fbcfe8" text-anchor="middle">CLASS OF 2000</text>
</svg>
