<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bbsNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e233d"/>
      <stop offset="60%" stop-color="#14365d"/>
      <stop offset="100%" stop-color="#08182b"/>
    </linearGradient>
    <linearGradient id="bbsGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="bbsCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    
    <!-- Text Paths -->
    <path id="topTextArc" d="M 75,250 A 175,175 0 0,1 425,250" fill="none"/>
    <path id="bottomTextArc" d="M 425,250 A 175,175 0 0,1 75,250" fill="none"/>
    
    <filter id="sealShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Seal Base -->
  <circle cx="250" cy="250" r="240" fill="url(#bbsNavy)" filter="url(#sealShadow)"/>
  
  <!-- Outer Gold Ring -->
  <circle cx="250" cy="250" r="232" fill="none" stroke="url(#bbsGold)" stroke-width="4"/>
  <circle cx="250" cy="250" r="224" fill="none" stroke="url(#bbsGold)" stroke-width="1.5" stroke-dasharray="6 4"/>
  
  <!-- Inner Ring Background -->
  <circle cx="250" cy="250" r="162" fill="#08182b" stroke="url(#bbsGold)" stroke-width="3"/>

  <!-- Ring Circular Typography -->
  <text font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="900" fill="url(#bbsGold)" letter-spacing="4">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      BINA BANGSA SCHOOL
    </textPath>
  </text>
  
  <text font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="800" fill="#fef08a" letter-spacing="3">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      PANTAI INDAH KAPUK • JAKARTA
    </textPath>
  </text>

  <!-- Star accents in ring -->
  <g fill="url(#bbsGold)">
    <polygon points="62,250 67,242 75,247 69,254 71,262 62,257 53,262 55,254 49,247 57,242" transform="scale(0.8) translate(15, 30)"/>
    <polygon points="438,250 443,242 451,247 445,254 447,262 438,257 429,262 431,254 425,247 433,242" transform="scale(0.8) translate(110, 30)"/>
  </g>

  <!-- Central Shield / Crest -->
  <g transform="translate(250, 245)">
    <!-- Shield Outline -->
    <path d="M 0,-95 C 65,-95 90,-75 90,-25 C 90,45 45,95 0,115 C -45,95 -90,45 -90,-25 C -90,-75 -65,-95 0,-95 Z" 
          fill="#1e3a8a" stroke="url(#bbsGold)" stroke-width="5" filter="url(#sealShadow)"/>

    <!-- Left Half Shield Tint -->
    <path d="M 0,-93 C 45,-93 88,-73 88,-25 C 88,43 44,93 0,113 Z" fill="#172554"/>
    <path d="M 0,-93 C -45,-93 -88,-73 -88,-25 C -88,43 -44,93 0,113 Z" fill="url(#bbsCrimson)"/>

    <!-- Heraldic Cross dividing the shield -->
    <line x1="0" y1="-93" x2="0" y2="113" stroke="url(#bbsGold)" stroke-width="4"/>
    <line x1="-88" y1="-15" x2="88" y2="-15" stroke="url(#bbsGold)" stroke-width="4"/>

    <!-- Upper Left Emblem: Open Book of Knowledge -->
    <g transform="translate(-42, -52) scale(0.65)">
      <path d="M0,20 C15,10 35,12 45,22 L45,-15 C35,-25 15,-23 0,-15 Z" fill="#fff" stroke="#ca8a04" stroke-width="2"/>
      <path d="M0,20 C-15,10 -35,12 -45,22 L-45,-15 C-35,-25 -15,-23 0,-15 Z" fill="#fff" stroke="#ca8a04" stroke-width="2"/>
      <line x1="0" y1="-15" x2="0" y2="20" stroke="#ca8a04" stroke-width="2"/>
      <!-- lines on book -->
      <line x1="-38" y1="-5" x2="-8" y2="-2" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="-38" y1="2" x2="-8" y2="5" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="8" y1="-2" x2="38" y2="-5" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="8" y1="5" x2="38" y2="2" stroke="#94a3b8" stroke-width="1.5"/>
    </g>

    <!-- Upper Right Emblem: Torch of Enlightenment -->
    <g transform="translate(44, -52) scale(0.65)">
      <!-- Flame -->
      <path d="M0,-30 C12,-15 15,-5 6,5 C-2,12 -12,0 -8,-10 C-8,-18 -4,-24 0,-30 Z" fill="#facc15" stroke="#b45309" stroke-width="1.5"/>
      <path d="M0,-22 C6,-12 8,-4 3,3 C-2,8 -8,0 -5,-7 Z" fill="#ef4444"/>
      <!-- Torch bowl & handle -->
      <path d="M-12,5 L12,5 L8,18 L-8,18 Z" fill="url(#bbsGold)" stroke="#854d0e" stroke-width="1.5"/>
      <line x1="0" y1="18" x2="0" y2="40" stroke="url(#bbsGold)" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Lower Emblem: 4 Stars of Character / Excellence -->
    <g transform="translate(0, 50) scale(0.75)" fill="url(#bbsGold)">
      <!-- Central Large Star -->
      <polygon points="0,-22 6,-6 22,-6 10,4 14,20 0,10 -14,20 -10,4 -22,-6 -6,-6"/>
    </g>
  </g>

  <!-- Bottom Banner: Motto "Gloria Dei Vivens Homo" -->
  <g transform="translate(250, 395)">
    <path d="M -140,0 L -120,-14 L 120,-14 L 140,0 L 120,14 L -120,14 Z" 
          fill="#fff" stroke="url(#bbsGold)" stroke-width="2.5" filter="url(#sealShadow)"/>
    <text x="0" y="5" font-family="'Cinzel', Georgia, serif" font-size="11.5" font-weight="900" 
          fill="#0e233d" letter-spacing="2" text-anchor="middle">
      GLORIA DEI VIVENS HOMO
    </text>
  </g>
</svg>
